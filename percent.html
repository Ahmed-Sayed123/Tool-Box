<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Percentage Calculator</title>
    <link rel="stylesheet" href="percent.css" />
  </head>
  <body>
    <button id="back">&larr;</button>
    <header>Percentage Calculator</header>
    <hr />
    <main>
      <label for="number">Enter The Number</label><br />
      <input type="number" id="number" /><br />

      <label for="percent">Enter The Percent(%)</label><br />
      <input type="number" id="percent" />
      <div id="parent">
        <button id="calculate">Calculate</button>
      </div>
      <div id="result">
        <p>Result</p>
        <h2 id="resultValue">0</h2>
      </div>
    </main>
    <script src="percent.js"></script>
  </body>
</html>
